[package]
name = "immersive-vr"
description = "Desktop to stereo 3D for Quest: capture, depth, encode, WebXR streaming"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
depth-infer.workspace = true
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap.workspace = true
# Same version as moq-nvenc's: its encoder opens on our CUDA context.
cudarc = { version = "0.19", default-features = false, features = ["driver", "nvrtc", "fallback-dynamic-loading", "cuda-12020"] }
if-addrs = "0.15"
libloading = "0.9"
moq-nvenc = "0.1.2"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
windows-capture = "2"
# The version windows-capture uses: its frames' D3D11 interfaces are ours.
windows = { version = "0.62", features = [
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }
# PC sound to the headset (process loopback capture).
wasapi = "0.25"

[dev-dependencies]
# The CPU filter the GPU resize kernel is checked against.
fast_image_resize = "6"
